name: Fusion UI PR CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: fusion-ui-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # PR 仅在 GitHub 托管的临时 Linux runner 执行容器验证，不接触发布凭据。
    name: PR container validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NEXT_PUBLIC_AUTH_SERVICE_BASE_URL: ${{ vars.NEXT_PUBLIC_AUTH_SERVICE_BASE_URL }}
      NEXT_PUBLIC_AUTH_SERVICE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AUTH_SERVICE_CLIENT_ID }}
      NEXT_PUBLIC_AUTH_CALLBACK_URL: ${{ vars.NEXT_PUBLIC_AUTH_CALLBACK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run release safety contract
        id: release_safety_contract
        run: .github/scripts/release-safety-contract.sh

      - name: Test and build Docker targets
        shell: bash
        run: |
          set -euo pipefail
          builder="fusion-ui-pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="fusion-ui-pr:${GITHUB_SHA}"

          docker buildx create --name "$builder" --driver docker-container --use
          docker buildx inspect --builder "$builder" --bootstrap

          docker buildx build \
            --builder "$builder" \
            --target test \
            --no-cache-filter test \
            --progress plain \
            --provenance=false \
            .

          docker buildx build \
            --builder "$builder" \
            --target production \
            --load \
            --progress plain \
            --provenance=false \
            --build-arg "NEXT_PUBLIC_AUTH_SERVICE_BASE_URL=${NEXT_PUBLIC_AUTH_SERVICE_BASE_URL}" \
            --build-arg "NEXT_PUBLIC_AUTH_SERVICE_CLIENT_ID=${NEXT_PUBLIC_AUTH_SERVICE_CLIENT_ID}" \
            --build-arg "NEXT_PUBLIC_AUTH_CALLBACK_URL=${NEXT_PUBLIC_AUTH_CALLBACK_URL}" \
            --build-arg "API_BACKEND_URL=http://fusion-api:8000" \
            -t "$image" \
            .
